name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    name: Docker image with all engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          # Same tag as compose.yaml, so `docker compose up --no-build` uses this image.
          tags: street-scene-ocr:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Download the models into the volume compose.yaml uses
        run: docker run --rm -v street-scene-ocr_models:/models street-scene-ocr:local street-scene-ocr warmup
      - name: Every engine reads easy synthetic signs
        run: |
          docker run --rm -v street-scene-ocr_models:/models -v "$PWD:/src:ro" -w /src \
            -e PYTHONDONTWRITEBYTECODE=1 street-scene-ocr:local \
            sh -c 'pip install --user --quiet pytest && python -m pytest -p no:cacheprovider -m engines tests/test_engines_real.py'
      - name: The service answers through Traefik and spreads requests over two containers
        run: |
          docker compose up -d --no-build
          # Traefik adds each replica once it is up, so keep asking until two different containers answer.
          for i in $(seq 90); do
            curl -fsS -o /dev/null -D - http://localhost:8080/healthz 2>/dev/null \
              | grep -i '^x-served-by' | tr -d '\r' | awk '{print $2}' >> served-by.txt || true
            [ "$(sort -u served-by.txt | wc -l)" -ge 2 ] && break
            sleep 2
          done
          sort served-by.txt | uniq -c
          test "$(sort -u served-by.txt | wc -l)" -ge 2
          curl -fsS -F file=@eval/data/synthetic/sign-00.jpg -F engine=rapidocr http://localhost:8080/api/ocr \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print(r['text']); assert r['regions']"
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
